name: just_game_engine_editor
description: "A level editor that runs inside your just_game_engine game while you develop it: scenes, inspector, 2D and 3D level design, timelines, tilesets, materials."
version: 0.1.0-dev.1
homepage: https://justunknown.com
repository: https://github.com/just-unknown-dev/just-game-engine-editor
issue_tracker: https://github.com/just-unknown-dev/just-game-engine-editor/issues
topics:
  - game-engine
  - gamedev
  - level-editor
  - editor
  - game

screenshots:
  - description: "The editor over a 2D level: scene tree, inspector, transform gizmo, a live preview of the game camera and the Assets dock."
    path: assets/screenshots/editor_2d_scene.png
  - description: "A 3D scene: the orbit view, the 3D gizmo, level aids, the game camera's preview and materials pictured in the Assets dock."
    path: assets/screenshots/editor_3d_scene.png
  - description: "The Level Designer: a tile stamp over the Level Map, the map's layers, the tileset palette, the tool strip and the minimap."
    path: assets/screenshots/editor_2d_level_designer.png
  - description: "The 3D Level Designer in four views with the World Builder kit: prefabs, view modes, materials and groups."
    path: assets/screenshots/editor_3d_level_designer.png
  - description: "The Timeline dock: curves for a ball's roll, hop, spin and squash, and its motion path drawn in the level."
    path: assets/screenshots/editor_timeline.png
  - description: "Physics: a collider edited with handles in the viewport, the rigid body's card, and named collision layers with their grid."
    path: assets/screenshots/editor_physics.png
  - description: "Play-testing in place: the game runs inside the editor and the Profiler times each system; Stop puts the level back."
    path: assets/screenshots/editor_play_test.png
  - description: "The 2D Material window: a normal-mapped wall under a light you drag, its effect cards and the light's settings."
    path: assets/screenshots/editor_2d_material.png
  - description: "The 3D Material window: a variant of the temple stone on a ball, lit by the open scene's own sky."
    path: assets/screenshots/editor_3d_material.png
  - description: "Settings, searchable: appearance, accessibility (text size, contrast, colour-blind safe colours), keys and more."
    path: assets/screenshots/editor_settings.png

# Declared, so pub.dev does not infer platforms from dependencies. The
# package compiles everywhere Flutter does (web and wasm too); it edits a
# project only on a desktop — Windows, macOS or Linux — in a debug build.
# Elsewhere JustGameEditorPlugin.register returns null and the game runs on
# its own.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ^3.11.0
  # just_game_engine's floor: Flutter GPU in Windows and Linux debug builds.
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  just_game_engine: ^2.0.0-dev.2
  just_editor_core: ^0.1.0-dev.1
  just_tiled: ^0.4.1
  just_signals: ^1.0.2
  # just_debugger: ^0.0.1

dev_dependencies:
  # GPU checks and pixel reads for the material tests that render.
  just_graphics_engine: ^0.1.0-dev.2
  just_colours: ^0.1.0
  just_storage: ^1.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
