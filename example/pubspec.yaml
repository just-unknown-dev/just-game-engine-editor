name: just_game_engine_editor_example
description: "A game with the just_game_engine_editor over it: run it on a desktop in debug mode to edit its scene."
publish_to: none

version: 0.0.1

environment:
  sdk: ^3.11.0
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  just_game_engine: ^2.0.0-dev.2
  just_game_engine_editor:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
